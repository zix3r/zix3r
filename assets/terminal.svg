<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">zix — writing code. occasionally, it works.</title>
  <desc id="desc">A dark terminal window with magenta, purple, and cyan accents matching the zix avatar. zix3r runs whoami: zix. Web apps, tools, and game prototypes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b090f"/>
      <stop offset=".5" stop-color="#171023"/>
      <stop offset="1" stop-color="#091c24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#24363c" stroke-opacity=".35"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#df0cf2"/>
      <stop offset=".5" stop-color="#9562ed"/>
      <stop offset="1" stop-color="#19bdd4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="55" width="1198" height="326" fill="url(#grid)"/>
  <path d="M 1 55 H 1199" stroke="#30363d"/>
  <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">
    <circle cx="29" cy="28" r="6" fill="#df0cf2"/>
    <circle cx="51" cy="28" r="6" fill="#9562ed"/>
    <circle cx="73" cy="28" r="6" fill="#19bdd4"/>
    <text x="600" y="33" text-anchor="middle">zix3r — ~/workspace</text>
    <text x="1128" y="33">UTF-8</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="58" y="111" font-size="21"><tspan fill="#d77bfa">zix3r@github</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
    <text x="52" y="224" fill="url(#accent)" font-size="112" font-weight="700" letter-spacing="-7">zix.</text>
    <text x="59" y="271" fill="#c9d1d9" font-size="23">writing code. occasionally, it works.</text>
    <text x="59" y="320" fill="#8b949e" font-size="18">web apps<tspan fill="#42575f"> / </tspan>tools<tspan fill="#42575f"> / </tspan>game prototypes</text>
    <text x="961" y="221" fill="url(#accent)" font-size="76" opacity=".85">&gt;_</text>
    <text x="59" y="369" fill="#19bdd4" font-size="16">❯<tspan fill="#8b949e"> explore the source below</tspan></text>
  </g>
  <rect x="59" y="342" width="1082" height="2" rx="1" fill="url(#accent)" opacity=".55"/>
</svg>
